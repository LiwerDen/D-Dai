        :root {
            --bg: #ffffff;
            --text: #000000;
            --accent: #6366f1;
        }

        .dark {
            --bg: #000000;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.4s ease, color 0.4s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body.dark { color: #ffffff; }
        body:not(.dark) { color: #000000; }

        .text-adaptive { color: inherit; }

        .glass {
            background: rgba(120, 120, 120, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(120, 120, 120, 0.1);
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px;
            min-width: 80px;
            text-align: center;
        }

        .dark .weather-card {
            background: rgba(255, 255, 255, 0.05);
        }

        body:not(.dark) .weather-card {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.05);
        }

        .weather-icon-img {
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4));
        }

        body:not(.dark) .weather-icon-img {
            filter: brightness(0.8) contrast(1.2);
        }

        header {
            padding-top: env(safe-area-inset-top, 1.2rem) !important;
            height: 6rem;
            display: flex;
            align-items: center;
        }

        main {
            padding-top: 7.5rem !important;
        }

        .page {
            display: none;
            animation: pageIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .page.active { display: block; }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-btn.active {
            color: var(--accent);
            transform: scale(1.1);
        }

        .tab-bar {
            padding-bottom: env(safe-area-inset-bottom, 1.5rem);
        }

        .canvas-container {
            margin: 0 auto !important;
            border-radius: 40px;
            overflow: hidden;
            background: #151515 !important;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .custom-swal-popup {
            border-radius: 35px !important;
            background: #111 !important;
            border: 1px solid #333 !important;
            color: white !important;
        }

        .custom-swal-input {
            background: #1a1a1a !important;
            border: 1px solid #333 !important;
            border-radius: 15px !important;
            color: white !important;
            font-family: inherit;
            margin-bottom: 10px !important;
        }

        .btn-ai-magic {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .item-dirty {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .dirty-badge {
            background: #f59e0b;
            color: black;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 900;
            text-transform: uppercase;

        #avatar-editor-overlay {

            z-index: 100;

            border: 2px solid #6366f1;
            overflow: hidden;
            position: relative;

        function initCanvas() {
            const size = Math.min(window.innerWidth - 64, 420);
            canvas = new fabric.Canvas('outfit-canvas', { 
                width: size, height: size * 1.6, backgroundColor: '#151515',
                preserveObjectStacking: true,
                allowTouchScrolling: true
            });
            
            // Надежный перехват клика по области аватара для открытия редактора на мобилках (Safari fix)
            const handleHeadInteraction = (e) => {
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                if (!clientX || !clientY) return;

                const rect = canvas.upperCanvasEl.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const center = canvas.width / 2;
                const avatarRadius = 50; 
                const headCenterY = 40 + avatarRadius; 
                
                const dx = x - center;
                const dy = y - headCenterY;

                if (Math.sqrt(dx * dx + dy * dy) <= avatarRadius) {
                    const now = Date.now();
                    if (now - lastUploadTrigger > 500) {
                        lastUploadTrigger = now;
                        triggerAvatarUpload();
                    }
                }
            };

            canvas.upperCanvasEl.addEventListener('click', handleHeadInteraction);
            canvas.upperCanvasEl.addEventListener('touchend', handleHeadInteraction);
            
            renderMannequin();
        }

        function renderMannequin() {
            const itemsToKeep = canvas.getObjects().filter(obj => !obj.isMannequinComponent);
            canvas.clear();
            canvas.setBackgroundColor('#151515', canvas.renderAll.bind(canvas));
            
            const center = canvas.width / 2;
            const bodyColor = '#242424';
            
            const avatarRadius = 50; 
            const headTop = 40;

            const headCircle = new fabric.Circle({
                radius: avatarRadius, fill: '#2d2d2d', left: center, top: headTop + avatarRadius,
                originX: 'center', originY: 'center', isMannequinComponent: true, selectable: false, hoverCursor: 'pointer'
            });

            const neck = new fabric.Rect({
                width: 20, height: 25, fill: '#1c1c1c', left: center, top: headTop + (avatarRadius * 2) - 5,
                originX: 'center', isMannequinComponent: true, selectable: false, hoverCursor: 'default'
            });

            const torsoWidth = 90;
            const torsoHeight = 180;
            const torsoTop = headTop + (avatarRadius * 2) + 15;

            const torso = new fabric.Rect({
                width: torsoWidth, height: torsoHeight, fill: bodyColor, left: center, top: torsoTop,
                originX: 'center', rx: 16, ry: 16, isMannequinComponent: true, selectable: false, hoverCursor: 'default'
            });

            const legWidth = 38;
            const legHeight = 220;
            const legTop = torsoTop + torsoHeight - 15;
            const legSpacing = 19; 

            const leftLeg = new fabric.Rect({
                width: legWidth, height: legHeight, fill: bodyColor, left: center - legSpacing, top: legTop,
                originX: 'center', rx: 10, ry: 10, isMannequinComponent: true, selectable: false, hoverCursor: 'default'
            });

            const rightLeg = new fabric.Rect({
                width: legWidth, height: legHeight, fill: bodyColor, left: center + legSpacing, top: legTop,
                originX: 'center', rx: 10, ry: 10, isMannequinComponent: true, selectable: false, hoverCursor: 'default'
            });

            canvas.add(neck, torso, leftLeg, rightLeg, headCircle);

            const avatarSrc = localStorage.getItem('user_avatar') || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            
            fabric.Image.fromURL(avatarSrc, (img) => {
                img.set({ 
                    left: center, top: headTop + avatarRadius, originX: 'center', originY: 'center',
                    selectable: false, isMannequinComponent: true, hoverCursor: 'pointer'
                });
                
                const scale = (avatarRadius * 2) / Math.min(img.width, img.height);
                img.scale(scale);
                img.set({
                    clipPath: new fabric.Circle({
                        radius: avatarRadius / scale, originX: 'center', originY: 'center'
                    })
                });
                
                canvas.add(img);
                
                itemsToKeep.forEach(obj => canvas.add(obj));
                sortCanvasLayers();
            }, { crossOrigin: 'anonymous' });
        }

];
            canvas._objects.sort((a, b) => {
                const weightA = a.isMannequinComponent ? -1 : (order.indexOf(a.clothingCategory) !== -1 ? order.indexOf(a.clothingCategory) : 99);
                const weightB = b.isMannequinComponent ? -1 : (order.indexOf(b.clothingCategory) !== -1 ? order.indexOf(b.clothingCategory) : 99);
                return weightA - weightB;
            });
            canvas.renderAll();
        }

        function addToCanvasAsync(imgUrl, category) {
            return new Promise((resolve) => {
                fabric.Image.fromURL(imgUrl, (img) => {
                    const existingObjects = canvas.getObjects().filter(obj => obj.clothingCategory === category);
                    existingObjects.forEach(obj => canvas.remove(obj));

                    setupClothingImage(img, category);
                    canvas.add(img);
                    sortCanvasLayers();
                    canvas.setActiveObject(img);
                    resolve(img);
                }, { crossOrigin: 'anonymous' });
            });
        }

        function addToCanvas(imgUrl, category) {
            addToCanvasAsync(imgUrl, category); 
        }

        async function geminiGenerateOutfit(retryCount = 0) {
            if (isAILoading) return;
            const cleanItems = allItems.filter(i => !i.isDirty);
            if (cleanItems.length < 1) {
                return Swal.fire({ title: 'Мало вещей', text: 'Загрузите вещи в гардероб.', background: '#111', color: '#fff', icon: 'info', customClass: { popup: 'custom-swal-popup' } });
            }
            
            let userQuery = null;
            if (retryCount === 0) {
                const { value: q, isDismissed } = await Swal.fire({
                    title: 'AI Стилист', input: 'text', inputPlaceholder: 'Куда вы собираетесь? (напр: на свидание, спортзал)',
                    background: '#111', color: '#fff', showCancelButton: true, confirmButtonText: 'Создать образ',
                    customClass: { popup: 'custom-swal-popup', input: 'custom-swal-input' }
                });
                if (isDismissed || !q) return;
                userQuery = q;
            } else {
                userQuery = window.lastUserQuery;
            }
            window.lastUserQuery = userQuery;
            isAILoading = true;

            if (retryCount === 0) {
                Swal.fire({ title: 'Стилист подбирает образ...', text: 'Анализируем гардероб и погоду...', background: '#111', color: '#fff', didOpen: () => Swal.showLoading(), customClass: { popup: 'custom-swal-popup' }, allowOutsideClick: false });
            }

            const weatherElement = document.getElementById('weather-temp');
            const weatherDescElement = document.getElementById('weather-desc');
            const weather = (weatherElement && weatherDescElement) ? (weatherElement.innerText + " " + weatherDescElement.innerText) : "Прекрасная погода";
            
            const itemsStr = cleanItems.map(i => `

ID:${i.id}

CATEGORY:${i.category}

NAME:${i.name}

COLOR:${i.aiData?.color || ""}

STYLE:${i.aiData?.style || ""}

SEASON:${i.aiData?.season || ""}

BRAND:${i.aiData?.brand || ""}

`).join("\\n");
            
            const prompt = `

You are professional stylist.

User destination:

${userQuery}

Weather:

${weather}

Available wardrobe:

${itemsStr}

Rules:

1 Select minimum 3 items.

2 Use matching colors.

3 Respect season.

4 Respect style.

5 Use upper clothing.

6 Use lower clothing.

7 Add shoes if available.

Return ONLY JSON:

{
"ids":[1,2,3],
"tip":"Russian stylist advice",
"image_prompt":"Fashion editorial photo"
}

`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await response.json();
                if (!data.candidates || data.candidates.length === 0) throw new Error("No components");
                
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                
                const result = JSON.parse(text);
                if (!result.ids || !Array.isArray(result.ids) || result.ids.length <3 ) throw new Error("Too few items");
                
                renderMannequin();
                const promises = result.ids.map(id => {
                    const item = cleanItems.find(i => i.id == id);
                    if (item) return addToCanvasAsync(item.img, item.category);
                    return Promise.resolve(null);
                });
                
                const addedItems = await Promise.all(promises);
                const actualAddedCount = addedItems.filter(i => i !== null).length;
                
                if (actualAddedCount === 0) throw new Error("Failed to render items");
                
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(result.image_prompt || "fashion modern editorial minimal look")}?width=500&height=600&nologo=true`;
                
                Swal.fire({
                    title: 'Образ готов!',
                    html: `<p class="mb-4 text-sm italic">"${result.tip || 'Прекрасный выбор для этого случая.'}"</p><img src="${imageUrl}" class="w-full rounded-2xl" alt="AI Style">`,
                    background: '#111', color: '#fff', customClass: { popup: 'custom-swal-popup' }
                });
            } catch (e) {
                if (retryCount < 2) {
                    isAILoading = false;
                    return geminiGenerateOutfit(retryCount + 1);
                }
                
                renderMannequin();
                const randomTops = cleanItems.filter(i => ["Футболки", "Топы", "Кофты", "Куртки"].includes(i.category));
                const randomBottoms = cleanItems.filter(i => ["Брюки", "Штаны", "Юбки", "Шорты"].includes(i.category));
                
                const fbPromises = [];
                if (randomTops.length > 0) fbPromises.push(addToCanvasAsync(randomTops[0].img, randomTops[0].category));
                if (randomBottoms.length > 0) fbPromises.push(addToCanvasAsync(randomBottoms[0].img, randomBottoms[0].category));
                
                await Promise.all(fbPromises);
                
                Swal.fire({
                    title: 'Образ готов!', text: 'ИИ стилист подобрал базовый вариант из вашего шкафа.',
                    icon: 'success', background: '#111', color: '#fff', customClass: { popup: 'custom-swal-popup' }
                });
            } finally { isAILoading = false; }
        }

        // АВАТАР РЕДАКТОР С НАСТОЯЩИМ TOUCH DRAG И PINCH ZOOM
        function initAvatarCropCanvas() {
            cropCanvas = new fabric.Canvas('crop-canvas-internal', { 
                width: 280, height: 280, backgroundColor: '#111', selection: false 
            });

            // Mobile Pinch Zoom
            let initialDistance = 0;
            let initialScale = 1;
            
            cropCanvas.upperCanvasEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2 && cropImgInstance) {
                    e.preventDefault();
                    initialDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialScale = cropImgInstance.scaleX;
                }
            }, {passive: false});

            cropCanvas.upperCanvasEl.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && cropImgInstance) {
                    e.preventDefault();
                    const distance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let zoom = initialScale * (distance / initialDistance);
                    if (zoom > 4) zoom = 4;
                    if (zoom < 0.1) zoom = 0.1;
                    cropImgInstance.set({ scaleX: zoom, scaleY: zoom });
                    document.getElementById('avatar-zoom-slider').value = zoom;
                    cropCanvas.renderAll();
                }
            }, {passive: false});

            // Desktop Mouse Wheel Zoom
            cropCanvas.on('mouse:wheel', function(opt) {
                if (!cropImgInstance) return;
                var delta = opt.e.deltaY;
                var zoom = cropImgInstance.scaleX;
                zoom *= (delta > 0 ? 0.95 : 1.05);
                if (zoom > 4) zoom = 4;
                if (zoom < 0.1) zoom = 0.1;
                cropImgInstance.set({ scaleX: zoom, scaleY: zoom });
                document.getElementById('avatar-zoom-slider').value = zoom;
                cropCanvas.renderAll();
                opt.e.preventDefault();
                opt.e.stopPropagation();
            });

            // Slider Zoom
            document.getElementById('avatar-zoom-slider').oninput = function(e) {
                if (!cropImgInstance) return;
                const val = parseFloat(e.target.value);
                cropImgInstance.set({ scaleX: val, scaleY: val });
                cropCanvas.renderAll();
            };
        }

       async function removeBackground(file) {

    const formData = new FormData();

    formData.append(
        "image_file",
        file
    );

    formData.append(
        "size",
        "auto"
    );

    try {

        const response = await fetch(
            "https://api.remove.bg/v1.0/removebg",
            {
                method: "POST",
                headers: {
                    "X-Api-Key": REMOVE_BG_KEY
                },
                body: formData
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            console.log(
                "remove.bg error:",
                response.status,
                errorText
            );

            return null;
        }

        const blob =
            await response.blob();

        return await blobToBase64(blob);

    } catch(err) {

        console.log(
            "remove.bg exception:",
            err
        );

        return null;
    }
}
async function removeBackgroundWithRetry(file){

    let result = null;

    for(let i=0;i<3;i++){

        result =
            await removeBackground(file);

        if(result)
            return result;

        await new Promise(r =>
            setTimeout(r,1500)
        );
    }

    return null;
}

}function markDirty(id) {
    const tx = db.transaction('items', 'readwrite');
    const store = tx.objectStore('items');

    const req = store.get(id);

    req.onsuccess = () => {
        const item = req.result;

        if (!item) return;

        item.isDirty = true;

        store.put(item).onsuccess = () => {
            refreshData();
        };
    };
}

function restoreClothing(id) {
    const tx = db.transaction('items', 'readwrite');
    const store = tx.objectStore('items');

    const req = store.get(id);

    req.onsuccess = () => {
        const item = req.result;

        if (!item) return;

        item.isDirty = false;

        store.put(item).onsuccess = () => {
            refreshData();
        };
    };
}

function deleteItem(id) {
    if (!confirm('Удалить вещь?')) return;

    db.transaction('items', 'readwrite')
        .objectStore('items')
        .delete(id)
        .onsuccess = () => refreshData();
}
